<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
<title>Startbar</title>
<link rel="stylesheet" href="../themes/base.css">
<link rel="stylesheet" href="../themes/system.css" id="theme-css">
</head>
<body>
<div class="bar">
  <div class="start" id="start">
    <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
    <linearGradient id="badge-ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" stop-color="#9fa8ff"/><stop offset="55%" stop-color="#5865F2"/><stop offset="100%" stop-color="#4c46d6"/></linearGradient>
    <linearGradient id="badge-go" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="76"><stop offset="0%" stop-color="#b6f47a"/><stop offset="100%" stop-color="#2fae57"/></linearGradient>
    </defs>
    <circle cx="60" cy="60" r="54" fill="#0b0e1a" stroke="url(#badge-ring)" stroke-width="6"/>
    <rect x="22" y="44" width="76" height="32" rx="16" fill="url(#badge-go)"/>
    <circle cx="40" cy="60" r="8" fill="#0b0e1a"/>
    <path d="M52 55 H84 M52 65 H74" stroke="#0b0e1a" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <span>Start</span>
  </div>
  <div class="quick" id="quick"></div>
  <div class="grip"></div>
  <div class="tasks" id="tasks"></div>
  <div class="tray">
    <span class="chev hidden" id="chev"></span>
    <span class="tray-icons" id="tray-icons"></span>
    <span class="clock" id="clock"><span class="time" id="time"></span><span class="date" id="date"></span></span>
  </div>
  <div class="desk" id="desk"></div>
</div>
<script src="../shared/schemes.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/clock.js"></script>
<script src="../shared/trayicons.js"></script>
<script src="../shared/reorder.js"></script>
<script src="../shared/order.js"></script>
<script src="bar.js"></script>
</body>
</html>
